name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        # Only the landing page and the public assets it references are published.
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css _site/
          cp site/assets/manrope-latin-wght.woff2 site/assets/social-preview.png _site/assets/
          cp docs/assets/dashboard.png docs/assets/settings.png \
             docs/assets/logo-dark.svg docs/assets/icon.svg \
             docs/assets/MANROPE-OFL.txt _site/assets/
          find _site -type f | sort
      - name: Check local references
        run: |
          missing=0
          for ref in $(grep -oE '(href|src)="(assets/[^"#]+|styles\.css)"' _site/index.html | sed -E 's/^(href|src)="//; s/"$//' | sort -u); do
            [ -f "_site/$ref" ] || { echo "missing: $ref" >&2; missing=1; }
          done
          # Social preview URLs are absolute Pages addresses; they must land in _site/assets.
          for url in $(grep -oE 'https://ddedic.github.io/openwrt-wan-observer/assets/[^"]+' _site/index.html | sort -u); do
            ref="assets/${url##*/}"
            [ -f "_site/$ref" ] || { echo "missing: $ref (from $url)" >&2; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
