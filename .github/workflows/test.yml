name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install offline test dependencies
        timeout-minutes: 15
        # Runner DNS to Ubuntu mirrors fails transiently; retry the whole install.
        run: |
          apt_opts='-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          for attempt in 1 2 3 4; do
            if sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y jq lua5.1 lua-cjson; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in $((attempt * 30))s" >&2
            sleep $((attempt * 30))
          done
          exit 1
      - name: Verify jq runtime compatibility
        run: |
          jq --version
          if [ '${{ matrix.os }}' = 'ubuntu-22.04' ]; then
            case "$(jq --version)" in
              jq-1.6|jq-1.6-*) ;;
              *) echo 'Ubuntu 22.04 must exercise jq 1.6 compatibility' >&2; exit 1 ;;
            esac
          fi
      - name: Shell syntax
        run: |
          sh -n package/wan-observer/files/wan-observer
          sh -n package/wan-observer/files/wan-observer-collect
          sh -n package/wan-observer/files/wan-observer-readiness
          sh -n package/wan-observer/files/wan-observer-quality
          luac5.1 -p package/wan-observer-glinet/files/wan-observer.cgi
      - name: Synthetic privacy and behavior tests
        run: python3 -m unittest discover -s tests -v
      - name: Router dashboard and PDF tests
        working-directory: package/wan-observer-glinet/ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Build router IPKs
        run: python3 tools/build-ipk.py
